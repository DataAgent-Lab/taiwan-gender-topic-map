.scard{font:inherit; text-align:left; cursor:pointer; background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:13px 16px; transition:.16s; display:flex; flex-direction:column; gap:3px;}

.intro .or{margin:20px 0 0; color:var(--faint); font-size:12px; letter-spacing:.3em;}
.intro .known{margin:16px 0 0; display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center;}
.intro .known .klbl{font-size:12.5px; color:var(--faint);}

.node.sfocus text{fill:var(--ink); font-weight:700;}

.brand{font-family:"Noto Serif TC",serif; font-weight:700; font-size:16px; color:var(--ink); background:rgba(252,248,238,.72); padding:6px 12px; border-radius:10px; backdrop-filter:blur(6px); cursor:pointer; transition:color .15s;}

.stories{display:flex; gap:7px; flex-wrap:wrap;}
.sbtn{font:inherit; font-size:13px; cursor:pointer; padding:6px 13px; border-radius:999px; border:1px solid var(--line); background:rgba(252,248,238,.82); color:var(--muted); backdrop-filter:blur(6px); transition:.15s;}

.hint{position:absolute; right:12px; bottom:12px; z-index:20; font-size:11.5px; color:var(--faint);}

@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
@media (max-width:600px){ .legend{display:none;} .brand{font-size:14px;} }
</style>
</head>

const NODES = RAW.entries.map(d => ({...d}));
const byId = new Map(NODES.map(n => [n.id, n]));
const LINKS = EDGES_RAW.edges.filter(e => byId.has(e.from) && byId.has(e.to)).map(e => ({ source: e.from, target: e.to, rel: e.rel }));
const deg = {}; LINKS.forEach(l => { deg[l.source]=(deg[l.source]||0)+1; deg[l.target]=(deg[l.target]||0)+1; });
NODES.forEach(n => n.deg = deg[n.id] || 0);
const baseR = d => 4 + Math.sqrt(d.deg) * 2.4;
const TYPE = { person:{c:'--t-person',t:'人物'}, org:{c:'--t-org',t:'組織'}, work:{c:'--t-work',t:'作品'}, venue:{c:'--t-venue',t:'場所'}, event:{c:'--t-event',t:'活動'}, milestone:{c:'--t-milestone',t:'里程碑'} };
const cssv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const colorOf = n => cssv(TYPE[n.type]?.c || '--muted');
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const host = u => { try{return new URL(u).hostname.replace(/^www\./,"");}catch(e){return "連結";} };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

document.getElementById('s-people').textContent = NODES.filter(n=>n.type==='person').length;
document.getElementById('s-all').textContent = NODES.length;

// legend

// ── SVG / zoom ──
const svg = d3.select('svg');
const W = () => window.innerWidth, H = () => window.innerHeight;
const root = svg.append('g');
const gLink = root.append('g'), gNode = root.append('g');
const zoom = d3.zoom().scaleExtent([0.25, 4]).on('zoom', e => root.attr('transform', e.transform));
svg.call(zoom);

const link = gLink.selectAll('path').data(LINKS).join('path').attr('class','link');
const node = gNode.selectAll('g').data(NODES).join('g').attr('class','node')
  .call(d3.drag()
    .on('start', (e,d)=>{ if(!e.active) sim.alphaTarget(.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on('drag', (e,d)=>{ d.fx=e.x; d.fy=e.y; })
    .on('end', (e,d)=>{ if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));
node.append('circle').attr('r', baseR).attr('fill', d=>colorOf(d));
node.append('text').attr('x', d=>6+Math.sqrt(d.deg)*2.4).attr('dy','.35em')
  .text(d=> d.deg>=4 ? d.name_zh : '').attr('opacity', d=> d.deg>=4?1:0);
node.on('click', (e,d)=>{ e.stopPropagation(); if(story.active) return; select(d, true); });
node.on('mouseenter', (e,d)=>{ if(!selected && !story.active) highlightNeighbors(d, .5); })
    .on('mouseleave', ()=>{ if(!selected && !story.active) clearHighlight(); });
svg.on('click', ()=>{ if(!story.active){ deselect(); } });

const sim = d3.forceSimulation(NODES)
  .force('link', d3.forceLink(LINKS).id(d=>d.id).distance(60).strength(.5))
  .force('charge', d3.forceManyBody().strength(-160))
  .force('collide', d3.forceCollide().radius(d=>10+Math.sqrt(d.deg)*2.4))
  .force('center', d3.forceCenter(W()/2, H()/2))
  .force('x', d3.forceX(W()/2).strength(.04)).force('y', d3.forceY(H()/2).strength(.04))
  .on('tick', ticked);
function ticked(){
  link.attr('d', d=>{
    const x1=d.source.x, y1=d.source.y, x2=d.target.x, y2=d.target.y;
    const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1;
    const off=len*0.14;                       // 手繪般的微彎
    const cx=(x1+x2)/2 - dy/len*off, cy=(y1+y2)/2 + dx/len*off;
    return `M${x1},${y1} Q${cx},${cy} ${x2},${y2}`;
  });
  node.attr('transform', d=>`translate(${d.x},${d.y})`);
}
window.addEventListener('resize', ()=>{ sim.force('center', d3.forceCenter(W()/2,H()/2)); sim.alpha(.3).restart(); });

// ── highlight / select ──
let selected = null;
const neighborsOf = id => { const s=new Set([id]); LINKS.forEach(l=>{ const a=l.source.id||l.source, b=l.target.id||l.target; if(a===id)s.add(b); if(b===id)s.add(a); }); return s; };
function highlightNeighbors(d, dim){
  const nb = neighborsOf(d.id);
  node.classed('dim', n=>!nb.has(n.id)).classed('soft', false);
  node.selectAll('text').attr('opacity', n=> nb.has(n.id)?1:(n.deg>=4?.15:0));
  link.classed('dim', l=> !(nb.has(l.source.id)&&nb.has(l.target.id)));
}
function clearHighlight(){ node.classed('dim',false).classed('soft',false); link.classed('dim',false).attr('stroke-dasharray',null).attr('stroke-dashoffset',null); node.selectAll('text').attr('opacity', n=>n.deg>=4?1:0); }
function select(d, pan){
  selected = d; highlightNeighbors(d);
  inkRipple(d); linkDraw(d);
  if(pan) panTo(d, 1.4);
  renderSide(d);
  document.getElementById('side').classList.add('open');
}
function deselect(){ selected=null; clearHighlight(); document.getElementById('side').classList.remove('open'); }
document.getElementById('side-close').onclick = deselect;

function panTo(d, scale, offX=0){
  const t = d3.zoomIdentity.translate((W()-offX)/2 - d.x*scale, H()/2 - d.y*scale).scale(scale);
  svg.transition().duration(reduce?0:700).call(zoom.transform, t);
}
// 點擊時的手作感動畫：墨滴暈開 + 節點彈跳 + 連線像被手繪出來
function inkRing(d){
  if(reduce) return;
  root.append('circle').attr('cx',d.x).attr('cy',d.y).attr('r', baseR(d))
    .attr('fill','none').attr('stroke', cssv('--accent')).attr('stroke-width',2).attr('opacity',.55)
    .transition().duration(720).ease(d3.easeCubicOut)
    .attr('r', baseR(d)+48).attr('stroke-width',.4).attr('opacity',0).remove();
}
function inkRipple(d){
  inkRing(d);
  if(reduce) return;
  const c = node.filter(n=>n.id===d.id).select('circle');
  c.interrupt().transition().duration(150).ease(d3.easeQuadOut).attr('r', baseR(d)*1.55)
   .transition().duration(300).ease(d3.easeElasticOut.amplitude(1).period(.35)).attr('r', baseR(d));
}
function linkDraw(d){
  if(reduce) return;
  link.filter(l => (l.source.id||l.source)===d.id || (l.target.id||l.target)===d.id)
    .each(function(){
      const L = this.getTotalLength ? this.getTotalLength() : 200;
      d3.select(this).attr('stroke-dasharray', L).attr('stroke-dashoffset', L)
        .transition().duration(650).ease(d3.easeCubicOut).attr('stroke-dashoffset', 0)
        .on('end', function(){ d3.select(this).attr('stroke-dasharray', null); });
    });
}

// ── side panel ──
const ROLE_C = {當事人:'--t-person', 盟友:'--muted', 推廣者:'--t-org'};
function renderSide(d){
  const conns = LINKS.filter(l=>(l.source.id||l.source)===d.id || (l.target.id||l.target)===d.id).map(l=>{
    const otherId = (l.source.id||l.source)===d.id ? (l.target.id||l.target) : (l.source.id||l.source);
    return { o: byId.get(otherId), rel: l.rel };
  });
  const role = d.type==='person' && d.person_role ? `<span class="role" style="color:${cssv(ROLE_C[d.person_role]||'--muted')};border-color:${cssv(ROLE_C[d.person_role]||'--line')}">${esc(d.person_role)}</span>` : '';
  const src = (d.sources&&d.sources[0]) ? `<div class="src"><a href="${esc(d.sources[0])}" target="_blank" rel="noopener">${esc(host(d.sources[0]))} ↗</a></div>` : '';
  document.getElementById('side-body').innerHTML = `
    <div class="kind" style="color:${colorOf(d)}">${TYPE[d.type]?.t||d.type}${d.region&&d.type!=='person'?' · '+esc(d.region):''}</div>
    <h2>${esc(d.name_zh)}</h2>${role}
    <p>${esc(d.desc_zh)}</p>
    ${d.why_entry?`<p class="why">${esc(d.why_entry)}</p>`:''}
    ${d.basis?`<p class="basis">${esc(d.basis)}</p>`:''}
    ${d.contributor?`<p style="font-size:12px;color:var(--faint);margin-top:10px">由 ${esc(d.contributor)} 提供</p>`:''}
    <div class="conns"><h3>與 ${conns.length} 個相連</h3>${
      conns.length ? conns.map(c=>`<button class="conn" data-id="${c.o.id}">${esc(c.o.name_zh)} <span class="rel">· ${esc(c.rel)}</span></button>`).join('')
      : '<p style="color:var(--faint);font-size:13px">目前還沒連上其他節點——但他/它也在這片星空下。</p>'
    }</div>${src}`;
  document.querySelectorAll('#side-body .conn').forEach(b=> b.onclick=()=> select(byId.get(b.dataset.id), true));
}

  ]},
  { title:'從一本書到我們不再沉默', hook:'一部小說，如何變成整個社會的 #MeToo', steps:[
    {id:'fang-siqi', say:'《房思琪的初戀樂園》以最痛的方式，讓「權勢性侵」不再能被沉默帶過。'},
    {id:'taiwan-metoo-2023', say:'2023 年，台灣 #MeToo 浪潮爆發，無數人第一次說出多年來說不出口的事。'},
    {id:'wave-makers', say:'「我們不要就這樣算了。」——《人選之人》這句台詞，成了那一年很多人的力量。'},
  ]},
];
const story = { active:false, steps:[], i:0 };
document.getElementById('stories').innerHTML = STORIES.map((s,i)=>`<button class="sbtn" data-s="${i}">▷ ${s.title}</button>`).join('');
document.querySelectorAll('#stories .sbtn').forEach(b=> b.onclick=()=> startStory(+b.dataset.s));
document.getElementById('story-cards').innerHTML = STORIES.map((s,i)=>`<button class="scard" data-s="${i}"><span class="sc-t">▷ ${s.title}</span><span class="sc-h">${s.hook}</span></button>`).join('');
document.querySelectorAll('#story-cards .scard').forEach(b=> b.onclick=()=> closeIntro(()=> setTimeout(()=>startStory(+b.dataset.s), 380)));
function startStory(si){
  deselect(); story.active=true; story.steps=STORIES[si].steps; story.i=0;
  document.getElementById('narr-st').textContent = STORIES[si].title;
  document.getElementById('narr').classList.add('show');
  showStep();
}
function showStep(){
  const st = story.steps[story.i]; const d = byId.get(st.id); if(!d) return;
  document.getElementById('narr-who').textContent = d.name_zh;
  document.getElementById('narr-say').textContent = st.say;
  document.getElementById('narr-prev').style.visibility = story.i===0?'hidden':'visible';
  document.getElementById('narr-next').textContent = story.i===story.steps.length-1 ? '完成 ✓' : '下一步 →';
  node.classed('dim', false).classed('soft', false);
  if(st.fan){
    // 收尾「炸開」：點亮這個 hub 與它連著的全部節點
    const nb = neighborsOf(d.id);
    node.classed('story-dim', n => !nb.has(n.id));
    node.classed('sfocus', n => n.id===d.id);
    node.select('circle')
      .attr('r', n => n.id===d.id ? baseR(n)*2.0 : (nb.has(n.id)?baseR(n)*1.25:baseR(n)))
      .attr('stroke', n => n.id===d.id ? cssv('--accent') : cssv('--card'))
      .attr('stroke-width', n => n.id===d.id ? 3 : 2);
    node.selectAll('text')
      .attr('opacity', n => nb.has(n.id) ? 1 : 0)
      .attr('font-size', n => n.id===d.id ? '15px' : '11px');
    link.classed('dim', l => !(nb.has(l.source.id||l.source) && nb.has(l.target.id||l.target)));
    renderSide(d); document.getElementById('side').classList.add('open');
    panTo(d, W()>700?1.0:0.75, W()>700 ? 300 : 0);
  } else {
    // 單一聚焦：當前節點放大加光暈、其餘淡到近乎隱形
    const pathIds = new Set(story.steps.slice(0, story.i+1).map(s=>s.id));
    node.classed('story-dim', n => n.id!==d.id && !pathIds.has(n.id));
    node.classed('sfocus', n => n.id===d.id);
    node.select('circle')
      .attr('r', n => n.id===d.id ? baseR(n)*2.1 : baseR(n))
      .attr('stroke', n => n.id===d.id ? cssv('--accent') : cssv('--card'))
      .attr('stroke-width', n => n.id===d.id ? 3 : 2);
    node.selectAll('text')
      .attr('opacity', n => n.id===d.id ? 1 : (pathIds.has(n.id)?.45:0))
      .attr('font-size', n => n.id===d.id ? '15px' : '11px');
    link.classed('dim', true);
    renderSide(d); document.getElementById('side').classList.add('open');
    panTo(d, 1.7, W()>700 ? 340 : 0);
  }
  // 每次切換節點都給墨滴暈開＋節點彈跳（沿用點擊的手作感）
  inkRing(d);
  if(!reduce){
    const fr = st.fan ? baseR(d)*2.0 : baseR(d)*2.1;
    node.filter(n=>n.id===d.id).select('circle').interrupt()
      .attr('r', fr*0.62)
      .transition().duration(380).ease(d3.easeElasticOut.amplitude(1).period(.4)).attr('r', fr);
  }
}
document.getElementById('narr-next').onclick = ()=>{ if(story.i<story.steps.length-1){ story.i++; showStep(); } else exitStory(); };
document.getElementById('narr-prev').onclick = ()=>{ if(story.i>0){ story.i--; showStep(); } };
document.getElementById('narr-exit').onclick = exitStory;
function exitStory(){
  story.active=false;
  document.getElementById('narr').classList.remove('show');
  node.classed('story-dim',false).classed('sfocus',false);
  node.select('circle').attr('r', baseR).attr('stroke', cssv('--card')).attr('stroke-width',2);
  node.selectAll('text').attr('font-size','11px');
  clearHighlight();
  document.getElementById('side').classList.remove('open');
  svg.transition().duration(reduce?0:600).call(zoom.transform, d3.zoomIdentity);
}
</script>
